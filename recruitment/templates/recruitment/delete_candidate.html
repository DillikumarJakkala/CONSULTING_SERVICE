{% extends 'recruitment/base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Confirm Deletion</h4>
        </div>
        <div class="card-body text-center">
            <p class="fs-5">Are you sure you want to delete candidate <strong>{{ candidate.candidate_name }}</strong>?</p>
            <p class="text-muted">This action cannot be undone.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
